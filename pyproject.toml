[project]
name = "jobmatch"
version = "0.1.0"
description = "JobMatch - Personal job-hunting toolkit with LLM-tailored CVs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "playwright>=1.44,<2",
    "flask>=3.0,<4",
    "flask-limiter>=3.5,<4",
    "fpdf2>=2.8,<3",
    "pymupdf>=1.23,<2",
    "pytesseract>=0.3,<1",
    "pillow>=10.0,<11",
    "pypdf>=4.0,<7",
    "paystackapi>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.12,<4",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-requests>=2.31,<3",
    "types-beautifulsoup4>=4.12,<5",
]
llm = [
    "openai>=1.0,<2",
    "google-genai>=1.0,<2",
    "groq>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests requiring external services",
    "security: marks tests as security-focused tests",
    "smoke: marks tests as quick smoke tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
exclude = [
    ".venv",
    "__pycache__",
    ".browser_profile",
    "archive",
    "data",
    "tailored_cvs",
    "cv_pdfs",
    "cover_letters",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print statements (allowed in CLI tools)
    "S101",  # assert (allowed in tests)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
ignore_missing_imports = true
exclude = [
    "archive",
    "data",
    "tailored_cvs",
    "cv_pdfs",
    "cover_letters",
    ".browser_profile",
    "__pycache__",
    "tests",
]
# Legacy codebase: suppress common noise while keeping basic checking
disable_error_code = [
    "var-annotated",      # Many untyped variables in legacy code
    "union-attr",         # Optional handling in legacy code
    "arg-type",           # Callable/optional type issues
    "index",              # Dict access issues
    "attr-defined",       # Dynamic attributes
    "operator",           # Union operator issues
    "call-arg",           # Unexpected kwargs (e.g., timeout in start_or_report)
]

[[tool.mypy.overrides]]
module = [
    "cv_tailor",
    "customer_engine",
    "job_scraper",
    "web_app",
    "apply_all",
    "prefill_apply",
    "send_applications",
    "career_crawler",
    "extract_email_targets",
    "import_scanned_jobs",
    "send_followups",
    "cv_to_pdf",
]
ignore_missing_imports = true